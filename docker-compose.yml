services:
  mongodb:
    image: mongo:6
    container_name: inventario-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - fiware

  orion:
    image: fiware/orion:3.10.1
    container_name: inventario-orion
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "${ORION_PORT}:1026"
    command: -dbhost mongodb -db orion -logLevel INFO
    networks:
      - fiware

  postgres:
    image: postgres:16
    container_name: inventario-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fiware

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: inventario-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      DEFAULT_USER: ${DEFAULT_USER}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    depends_on:
      - postgres
    volumes:
      - ./keycloak/realm-inventario.json:/opt/keycloak/data/import/realm-inventario.json
    networks:
      - fiware

  orion-init:
    image: curlimages/curl:latest
    container_name: inventario-orion-init
    restart: "no"
    depends_on:
      orion:
        condition: service_healthy
    volumes:
      - ./keycloak/init-orion.sh:/init-orion.sh
    entrypoint: sh /init-orion.sh
    networks:
      - fiware

volumes:
  mongodb_data:
  postgres_data:

networks:
  fiware:
