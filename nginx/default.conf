server {
    listen 80;
    server_name inventario-app.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name inventario-app.es;
    ssl_certificate /etc/letsencrypt/live/inventario-app.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inventario-app.es/privkey.pem;

    root /var/www/html;
    index index.html;

    location /auth/ {
        proxy_pass http://localhost:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /v2/ {
        proxy_pass http://localhost:1026/v2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
